//return the count of students
function countstudents(students) {
    const student = { A: 0, B: 0, C: 0 };

    for (let i = 0; i < students.length; i++) {
        const marks = students[i].marks;

        if (marks >= 90) {
            student.A++;
        } else if (marks >= 75) {
            student.B++;
        } else {
            student.C++;
        }
    }

    return student;
}
